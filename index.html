<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17191b" />
  <title>OCTA — Reuniões inteligentes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div class="app-shell">
    <aside class="sidebar glass">
      <div class="brand"><div class="brand-mark">▽</div><div>OCTA</div></div>
      <button class="icon-btn search-trigger" data-action="focus-search" aria-label="Buscar">⌕</button>
      <nav id="sidebarNav" class="nav"></nav>
      <div class="sidebar-footer">
        <button class="profile-card" data-action="edit-profile">
          <div class="avatar avatar-main" id="avatarMain">D</div>
          <div class="profile-copy"><strong id="profileNameSide">Denner Biersack</strong><span>Marketing Digital</span></div>
          <span class="status-dot"></span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="welcome">Bem-vindo de volta, <strong id="welcomeName">Denner</strong> 👋</div>
        <label class="searchbox glass"><span>⌕</span><input id="globalSearch" placeholder="Buscar reunião, pessoa ou gravação..."/><kbd>⌘ K</kbd></label>
        <div class="top-actions">
          <button class="icon-btn glass" data-action="notifications">♧<span class="notification-dot"></span></button>
          <button class="account-pill glass" data-action="edit-profile"><span class="avatar avatar-small" id="avatarTop">D</span><span id="profileNameTop">Denner Biersack</span><span>⌄</span></button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <input type="file" id="avatarInput" accept="image/*" hidden>
  <script src="app.js"></script>
</body>
</html>
