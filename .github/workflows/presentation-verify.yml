name: Verify presentation mode

on:
  push:
    branches:
      - main
      - feature/octa-presentation-mode
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node tests/presentation-integration-contract.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
